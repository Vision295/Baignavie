[project]
name = "baignavie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vision295", email = "theophilewachtel@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.5",
    "plotly>=7.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
baignavie = "baignavie:main"

[build-system]
