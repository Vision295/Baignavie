[project]
name = "sensor-poc"
version = "0.1.0"
description = "Sensor simulation and monitoring POC"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "streamlit",
]

[project.scripts]
sensor-simulator = "sensor_poc.simulator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
